name: ci
on: [ push, pull_request, workflow_dispatch ]

jobs:
  job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC)
    strategy:
      matrix:
        node: [ 20, 22 ]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish-Latest
        if: contains(github.ref, 'release') && matrix.node == '22' # Tag commit with 'release' to publish
        run: |
          npm install -g npm@latest # Trusted Publishing (OIDC) requires npm >= 11.5.1
          npm publish --tag latest

      - name: Publish-Next
        if: contains(github.ref, 'next') && matrix.node == '22' # Tag commit with 'next' to publish
        run: |
          npm install -g npm@latest # Trusted Publishing (OIDC) requires npm >= 11.5.1
          npm publish --tag next
