name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # OIDC Trusted Publishing (no npm token)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need full history to check the tag is on master
      - name: Ensure tag is on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "Tag $GITHUB_REF_NAME is not on master — refusing to publish."; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # OIDC needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
